<!doctype html>
<html lang="ru">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>SwiftScript — Playground</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.min.css" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div class="app">
    <header class="toolbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">S</span>
        <span class="brand-name">SwiftScript</span>
        <span class="brand-ver">0.1</span>
      </div>

      <span class="toolbar-sep" aria-hidden="true"></span>

      <button id="btn-run" class="primary" type="button">
        <svg class="icon" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M5.4 3.2 13.1 8 5.4 12.8Z" />
        </svg>
        Выполнить
      </button>
      <button id="btn-clear" type="button">Очистить</button>

      <span class="spacer"></span>
      <span class="info"><kbd>F5</kbd> — запуск</span>
    </header>

    <div class="workspace">
      <section class="pane">
        <div class="tab"><span class="dot dot-swift"></span>SwiftScript</div>
        <textarea id="editor"></textarea>
      </section>

      <section class="pane">
        <div class="tab"><span class="dot dot-js"></span>JavaScript</div>
        <textarea id="jsout"></textarea>
      </section>

      <section class="pane term-pane">
        <div class="tab"><span class="dot dot-term"></span>Вывод</div>
        <pre id="term"></pre>
      </section>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/swift/swift.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/javascript/javascript.min.js"></script>

  <script src="src/lexer.js"></script>
  <script src="src/parser.js"></script>
  <script src="src/codegen.js"></script>
  <script src="src/runtime.js"></script>
  <script src="src/compiler.js"></script>
  <script src="src/sandbox.js"></script>
  <script src="src/app.js"></script>

  <script>
    document.addEventListener(
      "keydown",
      (e) => {
        if (e.key === "F5") {
          e.preventDefault();
          document.getElementById("btn-run").click();
        }
      },
      true,
    );
  </script>
</body>

</html>
